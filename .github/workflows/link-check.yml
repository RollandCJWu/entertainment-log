name: Check links
on:
  schedule:
    - cron: '17 3 1 * *'   # 每月 1 號 11:17（台灣時間）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_links.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-report.json
          git diff --cached --quiet || (git commit -m "Update link report" && git push)
